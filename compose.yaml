services:
  tapo-enhance:
    build:
      context: .
      args:
        APP_VERSION: ${TAPO_ENHANCE_VERSION:-local}
    image: ${TAPO_ENHANCE_IMAGE:-tapo-enhance}:${TAPO_ENHANCE_VERSION:-local}
    pull_policy: ${TAPO_PULL_POLICY:-build}
    hostname: tapo-enhance
    ports:
      - "${APP_BIND_ADDRESS:-0.0.0.0}:${APP_PORT:-8000}:8000"
    environment:
      APP_PORT: 8000
      TAPO_CACHE_ROOT: /data
      TAPO_KEY_ROOT: /keys
      TAPO_SUBNET: ${TAPO_SUBNET:-}
    volumes:
      - tapo-data:/data
      - ./custom-themes:/app/themes/custom:ro
      - tapo-keys:/keys
    restart: unless-stopped

volumes:
  tapo-data:
  tapo-keys:

